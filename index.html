];
function publishingAccountIdentity(spec,c){const keys=['accountHandle','shopDomain','channelId','accountId','username','subreddit'],values=keys.map(k=>c.config?.[k]).filter(Boolean);return values.length?values.join(' · '):spec?.mode==='manual'?T('已登记人工发布账号','Manual publishing account registered'):T('平台身份待连接检查','Platform identity pending connection check')}
function publishingAccountEntry(spec,c){const markets=(c.config?.allowedMarkets||[]).join(' / ')||T('未设置区域','No market'),manual=spec?.mode==='manual';return `<div class="account-entry"><div class="account-entry-main"><div><strong>${esc(c.name)}</strong><small>${esc(publishingAccountIdentity(spec,c))}</small><small>${T('允许区域：','Markets: ')}${esc(markets)}</small></div>${agentStatus(c.status)}</div>${c.error?`<div class="notice" style="margin-top:9px">${esc(c.error.message)}</div>`:''}<div class="row" style="margin-top:10px">${button(T('配置','Configure'),'agent-connect',c.id,'small')}${!manual&&c.status!=='revoked'?button(T('测试','Test'),'agent-test',c.id,'small'):''}${c.status!=='revoked'?button(T('断开','Disconnect'),'agent-revoke',c.id,'small'):''}</div></div>`}
function publishingAccountCard(row){const spec=A.data.catalog.find(x=>x.id===row.provider),connections=A.data.connections.filter(c=>c.provider===row.provider&&c.status!=='revoked'),manual=spec?.mode==='manual',ready=connections.some(c=>manual?c.status==='manual':c.status==='tested');return `<section class="card account-card" id="account-${esc(row.id)}"><div class="account-card-head"><span class="account-icon">${esc(distributionIcon(row.id))}</span><div><div class="between"><h2>${esc(L(row.label))}</h2>${ready?badge(T('账号可用','Ready'),'green'):connections.length?badge(T('需要处理','Needs attention'),'amber'):badge(T('未配置','Not set'))}</div><p>${manual?T('人工发布：AI 生成平台版本，员工发布后回填链接。','Manual: AI prepares the platform version; staff publish and record the link.'):T('API 发布：保存凭据并通过连接测试后，仍需逐篇审核。','API: save credentials and pass the connection test; each item still requires approval.')}</p></div></div>${connections.map(c=>publishingAccountEntry(spec,c)).join('')||`<div class="account-empty">${T('还没有登记这个平台的发布账号。','No publishing account has been registered for this platform.')}</div>`}<div class="account-card-footer">${spec?button(connections.length?T('添加另一个账号','Add another account'):T('配置账号','Set up account'),'agent-connect-new',spec.id,connections.length?'small':'primary small'):`<span class="notice">${T('此连接器尚未载入，请重启后台。','This connector is not loaded; restart the backend.')}</span>`}</div></section>`}
function publishingAccountsPage(){const d=A.data;if(!d)return `${heading('TERGEO / PUBLISHING ACCOUNTS',T('发布账号配置','Publishing account setup'),T('统一管理平台账号、允许区域和发布方式。','Manage platform accounts, allowed markets and publishing methods in one place.'))}${A.error?`<div class="notice">${esc(A.error)}</div>`:empty(T('正在读取账号配置','Loading account setup'),T('从本机后台读取已保存的发布账号。','Loading saved publishing accounts from the local backend.'))}`;const uniqueProviders=[...new Set(PUBLISHING_ACCOUNT_PLATFORMS.map(x=>x.provider))],connections=d.connections.filter(c=>uniqueProviders.includes(c.provider)&&c.status!=='revoked'),automatic=connections.filter(c=>d.catalog.find(x=>x.id===c.provider)?.mode==='api'&&c.status==='tested').length,manual=connections.filter(c=>d.catalog.find(x=>x.id===c.provider)?.mode==='manual').length;return `${heading('TERGEO / PUBLISHING ACCOUNTS',T('发布账号配置','Publishing account setup'),T('账号只决定“发到哪里”；每个平台的内容生成、审核和发布进度仍在“平台推广”查看。','Accounts decide where content may go. Generation, approval and publishing progress remain in Platform promotion.'),button(T('刷新','Refresh'),'agent-refresh','','small'))}<div class="tiles distribution-summary">${[[connections.length,T('已登记账号','Registered accounts')],[automatic,T('自动发布已连通','API connections ready')],[manual,T('人工发布账号','Manual accounts')],[2,T('区域边界','Market boundaries')]].map(([n,t])=>`<div class="card tile"><label>${t}</label><strong>${n}</strong></div>`).join('')}</div><div class="account-flow"><b>${T('工作流程','Workflow')}</b><span>${T('配置账号和区域','Set up account & market')}</span><i>→</i><span>${T('平台推广生成版本','Prepare platform version')}</span><i>→</i><span>${T('员工审核','Employee approval')}</span><i>→</i><span>${T('自动发布或人工回填','API publish or manual receipt')}</span></div><div class="account-grid">${PUBLISHING_ACCOUNT_PLATFORMS.map(publishingAccountCard).join('')}</div><section class="card account-legend"><strong>${T('员工只需要记住三件事','Three things employees need to remember')}</strong><ol><li>${T('账号必须选择 US 或 CA；区域不一致时系统会阻止发布。','Every account must allow US or CA; mismatches are blocked.')}</li><li>${T('“账号可用”不代表内容已发布；每个平台版本仍要单独审核。','A ready account does not mean content is published; each platform version still needs approval.')}</li><li>${T('人工发布平台必须回填实际公开链接，才会计入“已核验发布”。','Manual platforms count as verified only after the real public URL is recorded.')}</li></ol></section>`}
const ownerPublishingAccountsPage=publishingAccountsPage;publishingAccountsPage=function(){return A.data&&!simpleIsOwner()?simpleOwnerOnlyPage():ownerPublishingAccountsPage()};
function distributionSources(){const artifacts=new Map((A.data?.artifacts||[]).map(a=>[a.id,a])),options=distributionProjection()?.sourceOptions||[];return options.map(option=>{const artifact=artifacts.get(option.id);return artifact?{...artifact,distributionReadinessStatus:option.readinessStatus}:null}).filter(Boolean)}
function distributionCreate(preselected='',sourceArtifactId='',preferredMarket=''){if(preselected.includes('|'))[preselected,preferredMarket]=preselected.split('|');const p=distributionProjection(),catalog=(p?.catalog||[]).filter(c=>!['website','shopify'].includes(c.id)&&!['Website','Shopify'].includes(c.channel)),sources=distributionSources(),marketSource=sources.find(a=>a.market===preferredMarket),selectedSource=sources.some(a=>a.id===sourceArtifactId)?sourceArtifactId:marketSource?.id||sources[0]?.id;agentModal(()=>T('从官网内容准备平台区域版本','Prepare regional platform versions from website content'),()=>!sources.length?`<div class="notice">${T('还没有官网内容。请先在“我的推广”选择产品和市场，并准备官网文章。','No website content is available. Choose a product and market in My promotions, then prepare a website article.')}</div>${button(T('返回我的推广','Go to My promotions'),'nav','agents','small')}`:`${select('sourceArtifactId',T('官网源内容（决定产品、区域和商品链接）','Website source (sets product, market and link)'),sources.map(a=>[a.id,`${a.market==='US'?T('美国','US'):T('加拿大','Canada')} · ${a.model||''} · ${a.title} · v${a.revision}`]),selectedSource)}<p class="simple-hint">${T('所选官网源内容决定区域。系统会据此生成不同话术，并绑定该区域的商品链接和发布账号。','The selected website source determines the market. The system generates market-specific copy and binds its product link and publishing account.')}</p><div class="distribution-choice">${catalog.map((c,index)=>`<label><input type="checkbox" name="channel_${esc(c.id)}" ${preselected?preselected===c.id:index<4?'checked':''}><span><strong>${esc(distributionValue(c.label)||c.channel||c.id)}</strong><small>${esc(distributionValue(c.format))}</small></span></label>`).join('')}</div><div class="distribution-note"><strong>${T('区域边界由后台再次校验','Regional boundaries are checked by the backend')}</strong><p>${T('区域、产品链接或目标账号不匹配时，版本不能进入外部执行。','A version cannot execute when its market, product link or target account does not match.')}</p></div>`,sources.length?async values=>{const channels=catalog.filter(c=>values['channel_'+c.id]).map(c=>c.id);if(!channels.length)throw Error(T('请至少选择一个平台。','Choose at least one platform.'));if(channels.length>4)throw Error(T('一次最多选择 4 个平台。','Choose up to four platforms at a time.'));const source=A.data.artifacts.find(a=>a.id===values.sourceArtifactId);const result=await api('distribution/derive',{sourceArtifactId:values.sourceArtifactId,channels,model:source?.model,market:source?.market});await agentDone(result.jobs?.length?T('平台区域版本已加入准备队列。','Regional platform versions were added to the preparation queue.'):T('没有新增任务；已有相同区域版本正在处理。','No new tasks were added; matching regional versions already exist.'))}:null,()=>T('开始准备','Start preparing'))}
function distributionPreview(id){const a=A.data?.artifacts?.find(x=>x.id===id);if(!a)return;agentModal(()=>T('平台内容预览','Platform content preview'),()=>`<div class="row">${badge(a.channel||T('渠道版本','Channel version'),'purple')}${badge((a.model||'')+' · '+(a.market||''))}</div><h2 class="simple-review-title">${esc(a.title)}</h2>${simplePreview(a.body)}<p class="source-note">v${a.revision} · ${T('预览不会发布内容。','Previewing does not publish content.')}</p><div class="distribution-actions">${button(T('打开审核','Open review'),'distribution-review',a.id,'primary small')}${button(T('导出','Export'),'agent-export-artifact',a.id,'small')}</div>`,null)}
function distributionEnhanceHome(){if(advancedMode||page!=='agents'||!A.data)return;const anchor=document.querySelector('.simple-next-step');if(!anchor||document.querySelector('.distribution-home'))return;const p=distributionProjection(),s=p?.summary;if(!p)return;anchor.insertAdjacentHTML('afterend',`<section class="distribution-home"><span class="distribution-home-icon">▦</span><div class="distribution-home-body"><strong>${T('平台推广','Platform promotion')}</strong><p>${s?T('正在准备 ','Preparing ')+(s.generating??'—')+T(' · 待审核 ',' · Needs review ')+(s.pendingReview??'—')+T(' · 已核验发布 ',' · Verified published ')+(s.published??'—'):T('查看每个平台的真实进度','See verified progress for every platform')}</p></div>${button(T('查看总览','Open overview'),'nav','distribution','small')}</section>`)}
function distributionEnhanceRegions(){if(!A.data||!['agents','distribution'].includes(page)||document.querySelector('.region-control-panel'))return;const anchor=page==='distribution'?document.querySelector('.heading'):document.querySelector('.employee-workboard');anchor?.insertAdjacentHTML('afterend',regionControlPanel())}
if(!document.getElementById('distribution-styles')){const style=document.createElement('style');style.id='distribution-styles';style.textContent=DISTRIBUTION_STYLES;document.head.appendChild(style)}
for(const route of ['distribution','accounts'])if(!AGENT_PAGES.includes(route))AGENT_PAGES.push(route);
const distributionBaseRender=render;render=function(){distributionBaseRender();distributionEnhanceHome();distributionEnhanceRegions()};
Object.assign(actions,{
 'distribution-create':distributionCreate,
 'distribution-from-source':id=>{closeDialog();page='distribution';history.replaceState({},'',location.pathname+'?page=distribution&lang='+lang);render();distributionCreate('',id)},
 'distribution-preview':distributionPreview,
 'distribution-review':id=>agentArtifact(id),
 'distribution-status':id=>{const action=A.data?.actions?.find(x=>x.id===id);if(action)agentAction(id)},
 'region-control':openRegionControl,

});
document.addEventListener('change',e=>{if(!['distribution-model','distribution-market'].includes(e.target.id))return;const model=document.getElementById('distribution-model')?.value||'',market=document.getElementById('distribution-market')?.value||'';api('distribution?model='+encodeURIComponent(model)+'&market='+encodeURIComponent(market)).then(value=>{A.data.distribution=value.distribution||value;A.error=null;render()}).catch(error=>{A.error=error.message;render()})});
render();

</script><style>.simple-question{transition:background .15s ease,border-color .15s ease,color .15s ease}.simple-question:hover{border-color:#c9c1f6;background:#faf9ff}.simple-question:has(input:checked){background:#f2efff;border-color:var(--accent);color:#40348c}.simple-question input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.simple-question span{display:block}.simple-question small{margin-left:0}</style></body></html>

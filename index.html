const WEBSITE_STORIES={
 pet:{title:'Pet hair on hard floors: a practical guide to the Tergeo V40',hook:'Pet hair on the floor is only half the story. Check what stays on the roller, too.',answer:'For pet-hair cleanup, check the roller design, bin access and the surfaces you actually clean. Tergeo lists the V40 with an anti-tangle multi-surface roller, an LED headlight and a removable battery. Those are features to evaluate in your home; they do not establish a zero-tangle result.',benefit:'The V40 page lists a 0.9 L dust tank with 0.7 L usable capacity, a telescopic aluminum wand and wall-mounted accessory storage. A crevice tool and a 2-in-1 sofa brush are included in the listed accessory set. The website gives a net weight of 2.9 kg. Together, these are useful details when planning floor, edge and upholstery cleaning, subject to the instructions for each attachment.',how:'Start with a small, defined section of hard floor. Check surface compatibility, attach the appropriate floor head and pick a stated operating mode. Record the type and amount of hair and the number of passes. After cleaning, inspect both the floor and the roller, then empty the bin following the operating instructions. A clean-looking floor and a clean roller are separate observations.',faq:[['Does anti-tangle mean no hair will ever wrap?','No. The website describes an anti-tangle roller. Hair length, amount, surface and maintenance can affect the outcome; a specific test is needed to support a result.'],['Does the V40 always run for 60 minutes?','The website and PDF tables list ECO 60 / Standard 35 / Turbo 17 minutes, but the PDF feature text says up to 50 minutes and mode names also vary. Confirm the current model manual before relying on a runtime claim; these are not measurements from this project.'],['What should I check before using it on a sofa?','The listed accessories include a 2-in-1 sofa brush. Confirm attachment and upholstery compatibility in the supplied instructions before use.']],shots:['Opening: show the uncleaned hard floor and hair close-up; do not imply a result yet.','Identify V40 on the unit; show the LED headlight, roller, bin and correct attachment.','Film the full cleaning pass with the stated mode and hair amount visible.','Power down as instructed, inspect the roller and show any remaining wrap and bin contents.'],caption:'Pet-hair cleanup deserves a closer look. The Tergeo V40 product page lists an anti-tangle roller, LED headlight and removable battery. This brand overview explains what to inspect before choosing a vacuum; it is not a zero-tangle performance claim.',tags:'#Tergeo #V40 #PetHair #CordlessVacuum'},
 apartment:{title:'Choosing a cordless vacuum for a small home: inside the Tergeo V50',hook:'A small home still needs room for the vacuum, its tools and charging.',answer:'For a small apartment, compare storage, product weight, bin access and included tools before choosing on suction alone. The Tergeo V50 product page lists a 2.6 kg net weight, a telescopic wand, a removable battery and wall-mounted storage. These are concrete starting points for checking fit in your space.',benefit:'The V50 has a listed 0.7 L dust tank, with 0.5 L usable capacity. The website lists a 200 W BLDC motor and 20 kPa maximum suction; these are manufacturer specifications, not this project’s independent measurements. The accessory list includes a crevice tool, integrated brush, two filter foams and a dust-bin cleaning tool. HEPA H11 is the listed filtration specification; it is not a promise of a health outcome.',how:'Measure the intended storage area and check how the supplied wall mount can be installed. Plan a short route through your main rooms, including edges and tight gaps. Try the permitted attachments, check access to the bin and see where the removable battery can be charged according to the instructions. Record comfort and handling separately from the published net weight; 2.6 kg is not a hand-unit-only figure.',faq:[['How long does the V50 run?','The website uses inconsistent mode names for its runtime figures. Ask for a current model-specific manual before relying on a particular mode/runtime combination. This guide does not turn that inconsistency into a runtime promise.'],['Is a smaller dust tank necessarily a disadvantage?','Compare the usable capacity with your own cleaning routine and how often you are comfortable emptying it. The V50 page lists 0.5 L usable capacity; household debris and frequency will determine the practical interval.'],['Can I charge the battery separately?','The product page describes a removable battery with separate charging. Follow the instructions for the supplied charger and battery, and confirm the local package.']],shots:['Opening: show the actual proposed storage location and measure its width and clearance.','Identify V50 and show the telescopic wand, listed tools and removable battery.','Film a short permitted route around room edges and furniture; document real handling.','Show bin access and the proposed charging/storage arrangement without inventing storage dimensions.'],caption:'A cordless vacuum should fit your storage routine as well as your floor. Tergeo lists the V50 at 2.6 kg net weight, with a telescopic wand, removable battery and 0.5 L usable dust capacity. Check the supplied tools, charging setup and local offer before choosing.',tags:'#Tergeo #V50 #ApartmentCleaning #CordlessVacuum'},
 roller:{title:'V40 roller care: what anti-tangle design does and what to inspect',hook:'An anti-tangle brush still deserves a maintenance check.',answer:'Anti-tangle describes the V40 roller’s design; it does not remove the need to inspect and maintain the brush. The official product page describes a removable multi-surface roller and one-click bin emptying. Use the supplied operating instructions for safe removal and cleaning, then assess what happens with your own hair and debris conditions.',benefit:'The V40 lists a removable battery, a telescopic wand, an LED headlight and HEPA H11 filtration. Its accessory set includes a dust-bin cleaning tool and two filter foams. The site also lists a 0.7 L usable dust capacity. These details help plan maintenance, but they do not establish cleaning intervals or confirm that a component is washable.',how:'Before handling the roller, switch off and isolate the appliance as directed in its instructions. Photograph the roller before and after a defined cleaning task. Record hair length/type, approximate amount, surface, operating mode and passes. Note where any hair accumulates. Follow the manual for release, cleaning and reassembly; do not infer that filters or powered parts can be rinsed.',faq:[['Does the anti-tangle feature replace regular maintenance?','No. Inspect the roller and bin at the interval recommended in the manual, and more often if performance changes. Do not describe a roller as maintenance-free based on its name.'],['Can I wash every filter and brush component?','The public product page does not establish a full washability procedure. Check the instructions for each component and any drying requirements before cleaning it.'],['What would make a useful demonstration?','Show the initial hair condition, uncut passes and the roller afterward, including any remaining wrap. Keep original footage and report the actual outcome rather than selecting only a favorable frame.']],shots:['Opening: macro view of the V40 roller and its release mechanism, without operating it while touching.','Film the defined cleaning task continuously and label hair type, amount and operating mode.','After safe shutdown, show the roller from all sides, including remaining wrap.','Show only maintenance steps confirmed by the supplied manual; finish with actual reassembly.'],caption:'Look beyond the cleaned floor. The Tergeo V40 is described with a removable anti-tangle roller and one-click bin emptying. Inspect the roller after use and follow the supplied maintenance instructions. Anti-tangle is a design feature, not a promise of zero maintenance.',tags:'#Tergeo #V40 #VacuumCare #RollerMaintenance'},
 wet:{title:'Tergeo W10: wet and dry floor cleaning with 180-degree recline',hook:'Before cleaning under furniture, check both clearance and floor compatibility.',answer:'The Tergeo W10 is a cordless wet and dry floor washer. Its product page lists 180-degree recline, separate 800 ml clean-water and 450 ml dirty-water tanks, and a 60-degree swivel. The official datasheet lists a reclined body height of 5.2 inches. This is a product dimension, not a guarantee of clearance under every item of furniture or compatibility with every floor finish.',benefit:'The W10 page lists a 3.5 kg net weight, a 271 mm roller width and product dimensions of 218 × 271 × 1150 mm. It describes one-touch self-cleaning, centrifugal air drying and a pet-hair strainer. The accessories listed are a charging base, cleaning brush, two filter foams and an agitator assembly. Centrifugal air drying should not be described as heated drying.',how:'Confirm that the floor manufacturer permits wet cleaning and read the W10 operating instructions for the working angle and tank requirements. Measure the actual gap under the furniture. Begin in an accessible area, record the mode and the amount/type of debris or liquid, and film a continuous pass. Inspect the remaining moisture and edges. Empty and maintain the tanks and roller as instructed after the task.',faq:[['Does 50 minutes mean 50 minutes of wet washing?','No. The specification table assigns 50 minutes to Vacuum mode, 30 to ECO and 20 to Turbo. Marketing copy on the same page is less specific. Use the table’s conditions and confirm them in the current manual.'],['Will it fit under every sofa?','No universal clearance is established by the 180-degree recline statement. Measure your furniture gap and check the machine’s actual working height and permitted operating conditions.'],['Does self-cleaning eliminate tank and roller care?','No. The website describes a self-cleaning cycle and centrifugal air drying. Follow the supplied instructions for emptying, inspection and maintenance; do not infer sterilization or maintenance-free operation.']],shots:['Opening: show the furniture gap measurement and identify the floor finish.','Identify W10; show separate clean and dirty tanks and their listed capacities.','After checking the manual, film the permitted recline and a continuous pass with mode labeled.','Show any residue and actual after-care; label centrifugal air drying accurately.'],caption:'Meet the Tergeo W10 floor washer: the official page lists 180° recline, 800 ml clean-water and 450 ml dirty-water tanks, and centrifugal air drying. Check furniture clearance and floor compatibility first. The listed 50-minute runtime is for Vacuum mode, not a blanket wet-washing claim.',tags:'#Tergeo #W10 #FloorWasher #FloorCare'}

 const p=WEBSITE_PRODUCTS[topic.model],s=WEBSITE_STORIES[topic.id],f=S.facts.find(x=>x.model===topic.model),e=S.evidence.find(x=>x.id===topic.id);

 const sources=`Product source (read 11 October 2026): ${p.url}\nOfficial datasheet: ${p.datasheet}\nCorporate background: ${WEBSITE_COMPANY.about}`;
 const end=`\n\nPRODUCT INFORMATION\n${p.url}\n\nAMAZON ${market} BRAND STORE (ordinary link, not an Attribution tag)\n${store}\n${marketNote}\n\nDisclosure: Produced by the Tergeo brand team. Product specifications cited here are first-party website statements. This is not an independent review or a completed performance test.`;
 const evidence=e.ready?`PROJECT TEST RECORD\nConditions: ${e.method}\nObserved findings: ${e.outcome}\nOriginal record: ${e.raw}`:'PRODUCTION CHECK\nNo project test result is recorded yet. The supplied official product video is a brand asset, not independent evidence. Film and record actual conditions before adding performance findings.';
 const reviewed=f.status==='verified'?`\n\nEDITOR REFERENCE — CURRENT USER-VERIFIED FACT CARD\n${f.text}\nSource: ${f.source}\nCheck the finished copy against this card; reconcile differences with the website snapshot before publication.`:'';
 if(channel==='Website')return {title:s.title,body:`# ${s.title}\n\n${s.answer}\n\n## The product details that matter\n${s.benefit}\n\n## A practical routine\n${s.how}\n\n## Frequently asked questions\n${s.faq.map(([q,a])=>'### '+q+'\n'+a).join('\n\n')}\n\n## Who makes Tergeo?\n${WEBSITE_COMPANY.intro[1]}\n\n## Check the original specifications\n${sources}${end}${reviewed}`};

// Fill only untouched data. The former generator is kept solely to recognize its exact output.
function enrichWebsiteData(){
 if(S.websiteRevision===WEBSITE_REVISION)return;
 let factsFilled=0,updated=0,preserved=0;
 for(const f of S.facts){if(f.status==='missing'&&!f.text.trim()&&!f.source.trim()&&!f.reviewer){Object.assign(f,{text:websiteFactText(f.model),source:WEBSITE_PRODUCTS[f.model].url+'\nRead: '+WEBSITE_COMPANY.readOn,status:'sourced',websiteRevision:WEBSITE_REVISION,version:f.version+1});factsFilled++}}
 for(const c of S.contents){
  const t=TOPICS.find(t=>t.id===c.topic),old=composeLegacyContent(t,c.channel,c.market);
  const untouched=c.version===1&&!c.draft&&!c.approved&&!c.receipt&&!c.history?.length&&c.title===old.title&&c.body===old.body;
  if(untouched){c.history=[{version:c.version,title:c.title,body:c.body,reason:'Website source enrichment'}];Object.assign(c,composeContent(t,c.channel,c.market),{version:c.version+1,factVersion:S.facts.find(f=>f.model===c.model).version,websiteRevision:WEBSITE_REVISION});updated++}
  else {c.websiteUpdateAvailable=true;preserved++}
 }
 S.websiteRevision=WEBSITE_REVISION;
 S.websiteImport={at:WEBSITE_COMPANY.readOn,factsFilled,updated,preserved};
 if(S.contents.length||S.savedAt)save('官网资料已补充 / Website sources added; existing edits retained.');
}

></div>`).join('')}</div><div class="grid2"><section><div class="between section-head" style="margin-top:0"><h2>${T('今天从这三件事开始','Start with these three actions')}</h2>${badge(T('Day 1–3','Day 1–3'))}</div><div class="card">${[['01',T('核实产品事实，而不是复制营销参数','Verify product facts before making claims'),`${ready}/3 · V40 / V50 / W10`, 'assets','facts'],['02',T('检查 US / CA 购买入口和库存','Check US / CA purchase routes and stock'),T('6 组型号与市场，分别记录 ASIN 和负责人','Six model/market combinations with ASIN and owner'),'assets','markets'],['03',T('打开四个主题，准备第一批内容','Prepare the first content from four topics'),T('实拍清单、官网答案、长短视频及社区回答','Shot list, website answers, long/short video and community drafts'),'content','topics']].map(([n,t,d,p,tb])=>`<div class="task"><span class="num">${n}</span><div class="body"><h3>${t}</h3><p>${d}</p></div>${button(T('去处理','Open'),'jump',p+':'+tb,'small')}</div>`).join('')}</div><div class="between section-head"><h2>${T('三个型号的推进情况','Progress by product')}</h2>${button(T('全部内容','All content'),'nav','content','ghost small')}</div><div class="card tablewrap"><table><thead><tr><th>${T('型号','Model')}</th><th>${T('事实状态','Facts')}</th><th>${T('内容 / 发布','Outputs / live')}</th><th>${T('下一步','Next step')}</th></tr></thead><tbody>${S.facts.map(f=>`<tr><td><strong>${f.model}</strong></td><td>${badge(f.status==='verified'?T('已人工核实','Manually verified'):f.status==='sourced'?T('官网资料待复核','Website data to review'):T('待补充核实','Needs verification'),f.status==='verified'?'green':'amber')}</td><td>${S.contents.filter(c=>c.model===f.model).length} / ${S.contents.filter(c=>c.model===f.model&&c.receipt).length}</td><td>${button(T('查看事实卡','Open facts'),'fact',f.model,'small')}</td></tr>`).join('')}</tbody></table></div></section><aside class="stack"><div class="card pad"><h2>${T('客户怎样找到并购买','How shoppers find and buy')}</h2><div class="journey">${[[T('被发现','Discovery'),'Google · ChatGPT · YouTube'],[T('看懂与信任','Understanding & trust'),'tergeoclean.com · '+T('实拍与第三方证据','Real footage & independent evidence')],[T('选择正确市场','Choose a marketplace'),'Amazon US / Amazon CA'],[T('根据实际结果调整','Learn from actual results'),'Attribution · '+T('成本 · 每周决策','Costs · Weekly decisions')]].map(([a,b],i)=>`<div class="journey-step"><i>${i+1}</i><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}</div></div><div class="notice">${T('现在可以编辑事实、准备内容、登记链接与发布、录入真实数据。所有工作保存在本机；软件尚未连接平台，也不会自动发布或发送邀约。','Edit facts, prepare content, register links and publications, and enter real data. Work stays in this browser. No platform is connected and nothing is published or sent automatically.')}</div></aside></div>`}
function planPage(){return `${heading('PLAN / EVIDENCE / ACTION',T('一份计划，贯穿 90 天','One plan for 90 days'),T('手册中的执行顺序已拆成任务。目标数量是规划参考，实际成果以记录为准。','The playbook is organized into actionable tasks. Targets are planning references; records show actual work.'),button(T('调整资源与选题','Adjust resources & topics'),'resources','','primary'))}${tabs([['roadmap',['执行路线','Roadmap']],['tasks',['任务与负责人','Tasks & owners']],['questions',['30 个用户问题','30 customer questions']]],tab.plan)}${tab.plan==='questions'?questionTable():tab.plan==='tasks'?`<div class="card tablewrap"><table><thead><tr><th>${T('时间','When')}</th><th>${T('任务与完成记录','Task and completion record')}</th><th>${T('负责人','Owner')}</th><th>${T('状态','Status')}</th><th></th></tr></thead><tbody>${S.tasks.map(t=>`<tr><td>${esc(t.when)}</td><td><strong>${esc(L(t.title))}</strong><p>${T('手册','Playbook')} p.${t.source} ${t.note?'· '+esc(t.note):''}</p></td><td>${esc(t.owner)}</td><td>${badge(t.done?T('已记录完成','Completion recorded'):t.deferred?T('本轮推迟','Deferred this round'):T('待推进','To do'),t.done?'green':t.deferred?'amber':'')}</td><td>${button(T('处理','Open'),'task',t.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card pad"><div class="between"><div><h2>${T('项目计划','Project plan')} v${S.plan.version}</h2><p class="small">${S.plan.topics.length} ${T('个启用主题','active topics')} · ${Number(S.brief.hours)} h / ${T('周','week')} · ¥${Number(S.brief.budget).toLocaleString()} / ${T('月','month')}</p></div>${button(S.plan.accepted?T('查看已采用版本','View adopted version'):T('采用这份计划','Adopt this plan'),'adopt','','primary')}</div><div class="budgetbar">${[22,32,26,20].map((n,i)=>`<span style="width:${n}%;opacity:${1-i*.15}"></span>`).join('')}</div><p class="source-note">${T('工作顺序：核实资料 → 准备证据 → 内容与分发 → 监测复盘。预算只是计划，未产生任何支出。','Work order: verify facts → prepare evidence → content and distribution → measure and review. Budget is a plan, not spending.')}</p></div><div class="phasegrid" style="margin-top:20px">${PHASES.map((p,i)=>`<article class="card phasecard ${phase===i?'active':''}"><div class="between"><span class="eyebrow" style="margin:0">${p.range}</span>${badge('0'+(i+1),'purple')}</div><h3>${L(p.title)}</h3><p class="small">${L(p.desc)}</p><ul>${p.items.map(x=>`<li>${L(x)}</li>`).join('')}</ul>${button(T('查看阶段任务','View phase tasks'),'phase',i,'small')}</article>`).join('')}</div><div class="section-head"><h2>${PHASES[phase].range} · ${T('关键交付','Key deliverables')}</h2></div><div class="card">${S.tasks.filter((t,i)=>(t.phase??(i<11?0:i<13?1:2))===phase&&!t.deferred).map((t,i)=>`<div class="task"><span class="num">${t.done?'✓':i+1}</span><div class="body"><h3>${esc(L(t.title))}</h3><p>${esc(t.when)} · ${esc(t.owner)} · ${T('手册','Playbook')} p.${t.source}</p></div>${button(T('打开','Open'),'task',t.id,'small')}</div>`).join('')}</div><div class="notice soft" style="margin-top:18px">${T('手册的周投入合计约 20–28 小时，部分章节另给低预算安排。这里允许调整资源并选择主题，不将“每天 30 分钟”误当全部生产工作量。','The playbook role estimates total about 20–28 hours weekly, with a separate low-budget setup. Adjust resources and topics here; the daily 30-minute routine is not the entire production workload.')}</div>`}`}
function questionTable(){const qs=QUESTIONS.filter(q=>q.kind===geoKind);return `<div class="toolbar pillbar">${button(T('20 个中性发现问题','20 neutral discovery questions'),'geo-kind','neutral',geoKind==='neutral'?'active':'')}${button(T('10 个品牌核查问题','10 brand verification questions'),'geo-kind','brand',geoKind==='brand'?'active':'')}</div><div class="notice soft" style="margin-bottom:17px">${T('手册 p.27–28 的原始 30 问原文保留。第 21–30 问包含品牌，单列核查，不进入中性提及率分母。','The original 30 questions from pp.27–28 are preserved. Questions 21–30 name the brand and are excluded from neutral mention-rate calculations.')}</div><div class="card tablewrap"><table><thead><tr><th>ID</th><th>${T('固定英文问题','Fixed English question')}</th><th>${T('操作','Action')}</th></tr></thead><tbody>${qs.map(q=>`<tr><td>Q${String(q.id).padStart(2,'0')}</td><td>${esc(q.text)}</td><td>${button(T('记录观测','Record observation'),'observe',q.id,'small')}</td></tr>`).join('')}</tbody></table></div>`}
const contentStatus=c=>c.receipt?T('已记录发布','Publication recorded'):c.approved?T('待人工发布','Ready for manual publishing'):T('待审核','Needs review');
function contentPage(){return `${heading('CONTENT / EVIDENCE / DELIVERY',T('从一个真实问题，做出一组内容','Build a content pack from a real question'),T('先整理证据，再编辑官网答案、视频脚本和社区回答。每条内容独立关联市场与链接。','Prepare evidence, then edit website answers, video scripts and community replies. Track each output by market and link.'),button(T('准备全部型号内容包','Prepare all product packs'),'generate-all','','primary'))}${tabs([['topics',['主题与证据包','Topics & evidence']],['library',['内容工作台','Content library']],['board',['执行看板','Execution board']],['creators',['达人与媒体','Creators & media']]],tab.content)}${tab.content==='topics'?`${filters()}<div class="topicgrid">${TOPICS.filter(t=>modelFilter==='all'||t.model===modelFilter).map(t=>{const e=S.evidence.find(e=>e.id===t.id),n=S.contents.filter(c=>c.topic===t.id).length;return `<article class="card topic"><div class="between">${badge(t.model,'purple')}${!S.plan.topics.includes(t.id)?badge(T('本轮推迟','Deferred'),'amber'):''}${badge(e.ready?T('证据已核实','Evidence verified'):T('实拍资料待补充','Footage needed'),e.ready?'green':'amber')}</div><h3>${L(t.name)}</h3><p>${esc(t.question)}</p><a href="${WEBSITE_PRODUCTS[t.model].url}" target="_blank" rel="noopener noreferrer" class="topic-photo">${websiteProductImage(t.model)}<span>${T('官网产品图 · 查看型号详情 ↗','Official image · View product ↗')}</span></a><p>${L(t.steps)}</p><div class="rule"></div><div class="between"><span class="small muted">${n} ${T('份内容','outputs')} · ${T('手册','Playbook')} p.${t.page}</span><div class="row">${button(T('证据包','Evidence'),'evidence',t.id,'small')}${button(T('准备内容','Prepare pack'),'generate',t.id,'primary small')}</div></div></article>`}).join('')}</div>`:tab.content==='creators'?creatorsPage():`${filters()}${tab.content==='library'?library():board()}`}`}
function visibleContents(){return S.contents.filter(c=>modelFilter==='all'||c.model===modelFilter)}
function library(){const cs=visibleContents();return cs.length?`<div class="card tablewrap"><table><thead><tr><th>${T('内容与主题','Output and topic')}</th><th>${T('型号 / 市场','Model / market')}</th><th>${T('渠道','Channel')}</th><th>${T('状态','Status')}</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td><strong>${esc(c.title)}</strong><p>${esc(c.id)} · v${c.version}</p></td><td>${c.model} / ${c.market}</td><td>${c.channel}</td><td>${badge(contentStatus(c),c.receipt?'green':c.approved?'purple':'amber')}${c.stale?`<p>${T('事实已更新，需重核','Facts changed; recheck needed')}</p>`:''}</td><td>${button(T('编辑与交付','Edit & deliver'),'content',c.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty(T('还没有内容包','No content packs yet'),T('从主题中准备文稿。脚本是拍摄方案，不会被当作已拍摄的视频。','Prepare drafts from a topic. A script is a filming plan, not a finished video.'),button(T('查看主题','View topics'),'tab','topics','primary'))}
function board(){return `<div class="board">${[['review',T('待核实与审核','Verify & review')],['ready',T('待人工发布','Ready to publish')],['live',T('已记录发布','Publication recorded')],['recheck',T('事实更新待复核','Facts changed')]].map(([id,title])=>{const cs=visibleContents().filter(c=>id==='recheck'?c.stale:id==='live'?c.receipt&&!c.stale:id==='ready'?c.approved&&!c.receipt&&!c.stale:!c.approved&&!c.receipt&&!c.stale);return `<section class="column"><h3>${title} ${badge(cs.length)}</h3>${cs.map(c=>`<article class="boarditem">${badge(c.model+' · '+c.market,'purple')}<h3>${esc(c.title)}</h3><p>${c.channel} · v${c.version}</p>${button(T('打开内容','Open output'),'content',c.id,'small')}</article>`).join('')||`<p class="small muted">${T('暂无内容','No outputs')}</p>`}</section>`}).join('')}</div>`}
function creatorsPage(){return `<div class="between section-head" style="margin-top:0"><div><h2>${T('让真实第三方验证产品','Let independent creators test the product')}</h2><p class="small">${T('筛选、草稿、合作与寄样记录。没有自动发信或私信。','Track qualification, drafts, agreements and samples. No automated email or DMs.')}</p></div>${button(T('添加达人 / 媒体','Add creator / media'),'creator','','primary')}</div>${S.creators.length?`<div class="card tablewrap"><table><thead><tr><th>${T('对象','Contact')}</th><th>${T('型号 / 市场','Model / market')}</th><th>${T('匹配度','Fit score')}</th><th>${T('阶段','Stage')}</th><th></th></tr></thead><tbody>${S.creators.map(c=>`<tr><td><strong>${esc(c.name)}</strong><p>${esc(c.platform)}</p></td><td>${c.model} / ${c.market}</td><td>${c.score} / 10</td><td>${esc(c.stage)}</td><td>${button(T('记录与合作草稿','Record & draft'),'creator',c.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty(T('先添加一个真实匹配的创作者','Start with a real, relevant creator'),T('记录主页、近期具体作品、受众市场及披露情况；不使用虚构达人填充列表。','Record the profile, a specific recent work, audience market and disclosure practices. No invented prospects.'),button(T('添加第一位','Add the first contact'),'creator','','primary'))}<div class="card pad" style="margin-top:20px"><h3>${T('手册的 10 分筛选法','The playbook’s 10-point screening')}</h3><p class="small" style="margin-top:10px">${T('市场、内容匹配、真实互动、播放稳定、披露与质量，各 0–2 分。7 分及以上只是接洽参考，不代表合作或销售保证。','Market, content fit, authentic engagement, view consistency and disclosure quality: 0–2 each. A score of 7+ is a contact guideline, not a guarantee.')}</p></div>`}
function corporateSourceCard(){const url=S.brief.company;const confirmed=url.replace(/\/$/,'')===CORPORATE_SOURCE.url.replace(/\/$/,'');return `<section class="card pad" style="margin-bottom:20px"><div class="between" style="flex-wrap:wrap"><div><div class="eyebrow">X-LION / ${T('企业官网','CORPORATE WEBSITE')}</div><h3>${confirmed?esc(CORPORATE_SOURCE.companyName):T('企业背景与资质来源','Company background and credentials')}</h3><p class="linktext" style="margin-top:7px">${esc(url)}</p></div>${webUrl(url)?`<a class="btn small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${T('打开企业官网 ↗','Open corporate website ↗')}</a>`:''}</div>${confirmed?`<div class="row" style="margin-top:16px">${badge(T('网址由用户确认','URL confirmed by user'),'green')}${CORPORATE_SOURCE.pages.map(([label,href])=>`<a class="btn ghost small" href="${href}" target="_blank" rel="noopener noreferrer">${T(({ 'About us':'公司介绍',Products:'产品目录',Certifications:'资质认证'})[label],label)} ↗</a>`).join('')}</div><p class="source-note">${T('首页读取于','Homepage read on')} ${CORPORATE_SOURCE.checkedOn} · ${T('公司名称来自官网自述。产品型号参数仍在各自事实卡中核实。','Company name is stated on the website. Model-specific specifications are verified in their own fact cards.')}</p>`:''}</section>`}
function assetsPage(){return `${heading('PRODUCT TRUTH / MARKET ROUTES',T('把事实、购买链接和账号准备好','Prepare facts, purchase routes and accounts'),T('已整理官网型号参数、产品图片、视频与品牌资料。核对差异后，进入内容审核与分发。','Product specs, official images, videos and brand details are ready. Review discrepancies, then prepare distribution.'),button(T('导出项目备份','Export project backup'),'backup','','primary'))}${corporateSourceCard()}${tabs([['facts',['产品事实卡','Product facts']],['sources',['官网资料库','Website library']],['markets',['US / CA 购买入口','US / CA purchase routes']],['links',['链接台账','Link register']],['connections',['平台执行方式','Platform access']]],tab.assets)}${tab.assets==='sources'?websiteLibrary():tab.assets==='facts'?`<div class="phasegrid">${S.facts.map(websiteProductCard).join('')}</div><p class="source-note">${T('参数来自各型号官网，资料差异在完整事实卡中列出；确认前仍为待复核。','Specifications come from model pages. Discrepancies are recorded in the full fact cards; review is still required.')}</p>`:tab.assets==='markets'?`<div class="card tablewrap"><table><thead><tr><th>${T('型号 / 市场','Model / market')}</th><th>ASIN</th><th>${T('库存 / 价格','Stock / price')}</th><th>${T('核查状态','Check status')}</th><th></th></tr></thead><tbody>${S.markets.map(m=>`<tr><td><strong>${m.model} / ${m.market}</strong></td><td>${esc(m.asin)||'—'}</td><td>${m.inventory===''?'—':esc(m.inventory)+' '+T('天','days')} / ${m.price===''?'—':esc(m.price)+' '+m.currency}</td><td>${badge(m.checked?T('已人工核查','Manually checked'):T('待核查','Needs check'),m.checked?'green':'amber')}<p>${esc(m.checkedAt)}</p></td><td>${button(T('核对入口','Check route'),'market',m.model+':'+m.market,'small')}</td></tr>`).join('')}</tbody></table></div><p class="source-note">${T('品牌店入口同时见于手册及官网。未核实每个型号在各市场的上架、ASIN、库存和价格，不能据此标记可购买。','Brand-store links appear in both the playbook and website. Model listings, ASINs, stock and prices remain unverified for each market.')}</p>`:tab.assets==='links'?linksPage():connectionsPage()}`}
function linksPage(){return `<div class="between section-head" style="margin-top:0"><h2>${T('每条内容有自己的链接','A distinct link for each output')}</h2>${button(T('登记或生成链接','Register / build link'),'link','','primary')}</div>${S.links.length?`<div class="card tablewrap"><table><thead><tr><th>${T('内容 / 市场','Content / market')}</th><th>${T('类型与目标','Type and target')}</th><th>${T('实际链接','Actual URL')}</th><th>${T('测试','Test')}</th><th></th></tr></thead><tbody>${S.links.map(l=>`<tr><td>${esc(l.content)}<p>${l.model} / ${l.market}</p></td><td>${l.kind}<p>${esc(l.channel)}</p></td><td class="linktext">${esc(l.url)}</td><td>${badge(l.tested?T('人工测试通过','Manually tested'):T('待点击测试','Needs click test'),l.tested?'green':'amber')}</td><td>${button(T('编辑','Edit'),'link',l.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty(T('还没有跟踪链接','No tracking links yet'),T('官网 UTM 可在这里生成；Amazon Attribution 必须从对应账户创建后粘贴。普通 Store 链接不能假装可归因。','Build website UTM links here. Paste Amazon Attribution links from the appropriate account. A normal Store URL is not an attribution link.'),button(T('建立链接','Create a link'),'link','','primary'))}`}
function connectionsPage(){return `<div class="topicgrid">${[['Google Search Console / Bing',T('核查网站和搜索表现；当前支持录入检查记录，尚未 OAuth 接入。','Inspect website and search performance. Manual records only; no OAuth integration.')],['ChatGPT / Google / Bing',T('复制固定问题并人工记录原文、来源和条件；没有实时采样接口。','Copy fixed questions and record answers, sources and conditions manually. No live sampling API.')],['Amazon US / CA',T('各市场创建 Attribution 链接后登记。下载后台数据，按内容与市场录入；尚未连接 Amazon API。','Register Attribution links created for each market. Enter exported account data by output and market. No Amazon API connection.')],['YouTube / TikTok / Instagram',T('准备脚本与发布包，人工完成拍摄、剪辑和发布，再记录公开链接。','Prepare scripts and publishing packs. Film, edit and publish manually, then record public URLs.')],['Reddit / Quora',T('提供带真实身份披露的回答草稿；阅读社区规则后由负责人决定是否发布。','Prepare replies with truthful affiliation disclosure. The owner checks community rules before publishing.')],['Creators / Media',T('本地记录对象、评分、寄样和授权，准备个性化草稿；不会自动联系任何人。','Keep local contact, scoring, samples and rights records. Prepare personal drafts; nothing is sent automatically.')]].map(([n,d])=>`<div class="card pad"><div class="between"><h3>${n}</h3>${badge(T('人工执行','Manual workflow'),'amber')}</div><p class="small" style="margin-top:15px">${d}</p></div>`).join('')}</div>`}
function resultsPage(){return `${heading('MEASURE / LEARN / DECIDE',T('看清哪条内容，带来什么结果','See what each output actually produces'),T('真实数据从这里开始积累。US、CA 分开统计，未录入显示为空，不用播放量代替订单。','Build a record of real results. Review US and CA separately. Missing values stay empty; views are not orders.'),button(T('导出当前记录','Export records'),'export-records','','primary'))}${tabs([['geo',['AI 与搜索观测','AI & search observations']],['sales',['Amazon 销售与成本','Amazon sales & costs']],['decisions',['每周决策','Weekly decisions']]],tab.results)}<div class="toolbar"><select id="market-filter" aria-label="${T('市场','Market')}">${opts(['US','CA'],marketFilter)}</select><span class="small muted">${T('记录来自人工录入，未连接实时平台','Manually entered records; no live platform connection')}</span></div>${tab.results==='geo'?geoPage():tab.results==='sales'?salesPage():decisionsPage()}`}
function geoPage(){const obs=S.observations.filter(o=>o.market===marketFilter);const key=o=>JSON.stringify([o.date,o.platform,o.search,o.conditions]);const batches=[...new Map([...obs].reverse().map(o=>[key(o),o])).entries()];const latest=batches.find(([k])=>k===geoBatchKey)?.[1]||batches[0]?.[1]||null;const batch=latest?obs.filter(o=>key(o)===key(latest)):[];const neutral=batch.filter(o=>QUESTIONS.find(q=>q.id===o.question)?.kind==='neutral'&&o.valid);const mentions=neutral.filter(o=>o.mention).length;const cited=neutral.filter(o=>o.citation&&o.related).length;const rate=n=>neutral.length?(100*n/neutral.length).toFixed(1)+'%':'—';return `${batches.length?`<div class="field"><label for="geo-batch">${T('查看观测批次','Observation batch')}</label><select id="geo-batch">${opts(batches.map(([k,o])=>[k,`${o.date} · ${o.platform} · ${o.search} · ${o.conditions}`]),latest?key(latest):'')}</select></div>`:''}<div class="tiles">${[[T('有效中性回答','Valid neutral answers'),neutral.length||'—'],[T('中性品牌提及率','Neutral mention rate'),rate(mentions)],[T('相关来源引用率','Relevant citation rate'),rate(cited)],[T('品牌核查记录','Brand check records'),batch.filter(o=>QUESTIONS.find(q=>q.id===o.question)?.kind==='brand').length||'—']].map(([t,v])=>`<div class="card tile"><label>${t}</label><strong>${v}</strong><small>${T('当前批次','Current batch')}</small></div>`).join('')}</div><div class="notice soft">${latest?esc(latest.date+' · '+latest.platform+' · '+latest.market+' · '+latest.search+' · '+latest.conditions):T('尚无观测。选择一个问题，复制到目标平台，记录实际回答。','No observations yet. Choose a question, use it on the target platform and record the actual answer.')}<br>${T('提及率只统计同日、同市场、同平台和搜索模式的有效中性回答。无效或缺失回答不记为“未提及”。品牌问题单列。','Rates use valid neutral answers from the same day, market, platform and search mode. Failed or missing answers are not non-mentions. Brand checks are separate.')}</div><div class="between section-head"><h2>${T('固定问题与观测原文','Fixed questions and observed answers')}</h2>${button(T('选择问题并记录','Choose question & record'),'observe',1,'primary')}</div>${obs.length?`<div class="card tablewrap"><table><thead><tr><th>${T('批次','Batch')}</th><th>${T('问题','Question')}</th><th>${T('提及 / 引用','Mention / citation')}</th><th></th></tr></thead><tbody>${[...obs].reverse().map(o=>`<tr><td>${esc(o.date)}<p>${esc(o.platform)} · ${esc(o.search)}</p></td><td>Q${o.question}<p>${esc(QUESTIONS.find(q=>q.id===o.question)?.text)}</p></td><td>${!o.valid?T('无效回答','Invalid answer'):(o.mention?T('提及','Mentioned'):T('未提及','Not mentioned'))}<p class="linktext">${esc(o.citation)||'—'}</p></td><td>${button(T('查看与修正','View / correct'),'observation',o.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty(T('建立第一条真实基线','Record the first real baseline'),T('可记录 ChatGPT、Google、Bing/Copilot 的回答。界面不会随机生成排名或提及率。','Record results from ChatGPT, Google or Bing/Copilot. The workspace never invents rankings or mention rates.'),button(T('查看 30 问','View 30 questions'),'jump','plan:questions','primary'))}`}
function salesPage(){const ss=S.sales.filter(s=>s.market===marketFilter);return `<div class="between section-head" style="margin-top:0"><div><h2>Amazon ${marketFilter} · ${T('按内容核对归因数据','Attribution by output')}</h2><p class="small">${T('空值与 0 分开。CPA = 同币种全成本 ÷ 净订单；归因销售不等于增量销售。','Missing values differ from zero. CPA = same-currency full cost / net orders. Attribution does not establish incremental sales.')}</p></div>${button(T('录入一条周数据','Add weekly record'),'sale','','primary')}</div>${ss.length?`<div class="card tablewrap"><table><thead><tr><th>${T('周 / 内容','Week / output')}</th><th>${T('点击 / DPV','Clicks / DPV')}</th><th>${T('购买 / 净订单','Purchases / net orders')}</th><th>${T('销售 / 全成本','Sales / full cost')}</th><th>CPA</th><th>${T('判断','Decision')}</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${esc(s.week)}<p>${esc(s.content)} · ${s.model}</p></td><td>${s.clicks??'—'} / ${s.dpv??'—'}</td><td>${s.orders??'—'} / ${s.net??'—'}</td><td>${s.revenue??'—'} / ${s.cost??'—'}<p>${s.currency}</p></td><td>${s.net>0&&s.cost!==null?(s.cost/s.net).toFixed(2):'—'}</td><td>${badge(saleSignal(s)[0],saleSignal(s)[1])}</td><td>${button(T('查看','View'),'sale',s.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty(T('还没有 Amazon 销售记录','No Amazon sales records yet'),T('从对应市场的 Attribution 报告录入。没有权限或数据时留空，不用 GA4 推算 Amazon 订单。','Enter data from the relevant marketplace Attribution report. Leave unavailable data empty; GA4 cannot infer Amazon orders.'),button(T('录入真实数据','Enter actual data'),'sale','','primary'))}<div class="notice" style="margin-top:18px">${T('信号是排查建议，不会自动加预算。手册阈值为待校准参考；扩大前还需要可归属订单、财务盈亏线、正常库存与退货等条件。','Signals suggest investigation and never change spend. Playbook thresholds are provisional. Expansion also requires attributable orders, verified economics, healthy stock and returns.')}</div>`}
function saleSignal(s){if(s.net===0&&s.clicks>=100)return [T('暂停放大，先排查','Pause scaling; investigate'),'red'];if(s.net===null||s.cost===null||s.breakeven===null)return [T('补齐口径与成本','Complete definitions & costs'),'amber'];if(s.net===0)return [T('零净订单，不计算 CPA','Zero net orders; CPA undefined'),'amber'];if(s.cost/s.net>s.breakeven)return [T('高于盈亏线','Above break-even'),'red'];if(s.clicks===null||s.clicks<100)return [T('样本不足，继续观察','Limited sample; observe'),'amber'];return [T('可复核候选，不自动放大','Review candidate; no auto scaling'),'green']}
function decisionsPage(){return `<div class="between section-head" style="margin-top:0"><h2>${T('每周留下明确的下一步','End each week with a concrete next step')}</h2>${button(T('新增决策','Add decision'),'decision','','primary')}</div>${S.decisions.length?`<div class="stack">${S.decisions.filter(d=>d.market===marketFilter).map(d=>`<div class="card pad"><div class="between"><div class="row">${badge(L(({continue:['继续','Continue'],change:['修改','Change'],stop:['停止','Stop']})[d.type]),d.type==='continue'?'green':'amber')}<h3>${esc(d.action)}</h3></div>${button(T('编辑','Edit'),'decision',d.id,'small')}</div><p class="small" style="margin-top:12px">${esc(d.evidence)}</p><p class="source-note">${esc(d.owner)} · ${esc(d.due)} · ${d.market}</p></div>`).join('')||empty(T('该市场暂无决策','No decisions for this market'),T('切换市场或新建本市场决策。','Switch markets or add a decision.'))}</div>`:empty(T('继续什么，修改什么，停止什么？','What should continue, change or stop?'),T('每个决定写明证据、负责人和截止日期。它会进入项目任务清单，不执行外部预算操作。','Record evidence, owner and deadline. The decision becomes a project task; no external budget is changed.'),button(T('记录本周决定','Record this week’s decision'),'decision','','primary'))}`}
function modal(title,body,submit,label){activeDialog={title,body,submit,label};paintDialog()}
function paintDialog(){const d=activeDialog;if(!d)return;dialogSubmit=d.submit;document.getElementById('layer').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${typeof d.title==='function'?d.title():d.title}</h2>${langUI()}<button class="close" type="button" data-act="close" aria-label="${T('关闭','Close')}">×</button></header><form id="dialog-form" style="display:contents"><div class="modal-body"><div id="form-error" role="alert"></div>${typeof d.body==='function'?d.body():d.body}</div><footer class="modal-foot">${button(T('关闭','Close'),'close')}${d.submit?`<button class="btn primary" type="submit">${typeof d.label==='function'?d.label():d.label||T('保存','Save')}</button>`:''}</footer></form></section></div>`}
function closeDialog(){activeDialog=null;dialogSubmit=null;document.getElementById('layer').innerHTML=''}
function required(v,msg){if(!String(v||'').trim())throw Error(msg);return String(v).trim()}
function webUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password}catch{return false}}
function needUrl(v){if(!webUrl(v))throw Error(T('请填写完整的 http/https 网址。','Enter a complete http/https URL.'));return v.trim()}
function num(v,min=0){if(v==='')return null;const n=Number(v);if(!Number.isFinite(n)||n<min)throw Error(T('请填写有效的非负数字。','Enter a valid non-negative number.'));return n}
function fileDownload(name,content,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function put(list,obj){const i=list.findIndex(x=>x.id===obj.id);if(i>=0)list[i]=obj;else list.push(obj)}
function saved(){save();closeDialog();render();toast('已保存到本机，可继续下一步。','Saved locally. Continue to the next step.')}
function openBrief(){modal(()=>T('企业推广简报','Promotion brief'),()=>`<div class="fields">${field('brand',T('品牌 / 企业','Brand / company'),S.brief.brand)}${field('owner',T('项目负责人','Project owner'),S.brief.owner)}${field('site',T('品牌内容网站','Brand content website'),S.brief.site,'url')}${field('company',T('企业背书网站','Company evidence website'),S.brief.company,'url')}${area('goal',T('希望达成什么','Business objective'),S.brief.goal)}${area('audience',T('目标消费者','Target shoppers'),S.brief.audience)}${field('start',T('计划开始日期','Plan start date'),S.brief.start,'date')}${field('hours',T('每周人工投入小时','Human hours per week'),S.brief.hours,'number','min="1" max="168"')}${field('budget',T('月计划预算 RMB','Monthly planned budget RMB'),S.brief.budget,'number','min="0"')}</div><div class="notice soft">${T('三个型号及 US/CA 始终保留。预算来自你的计划，不会触发支付或广告投放。','All three products and both markets remain available. Planned budget does not trigger payments or advertising.')}</div>`,d=>{required(d.brand,T('请填写品牌名称。','Enter a brand name.'));needUrl(d.site);needUrl(d.company);const changed=['goal','audience','site'].some(k=>d[k]!==S.brief[k]);Object.assign(S.brief,d,{hours:Number(d.hours),budget:Number(d.budget)});if(changed){S.plan.accepted=false;S.plan.version++;}saved()})}
function openResources(){modal(()=>T('调整资源，预览计划变化','Adjust resources and preview changes'),()=>`<div class="fields">${field('hours',T('未来每周人工投入小时','Human hours per week going forward'),S.brief.hours,'number','min="1" max="168"')}${field('budget',T('月预算 RMB','Monthly budget RMB'),S.brief.budget,'number','min="0"')}</div><h3>${T('本轮启用主题','Topics active this round')}</h3>${TOPICS.map(t=>check('topic-'+t.id,t.model+' · '+L(t.name),S.plan.topics.includes(t.id))).join('')}<div class="notice soft">${T('选择减少后，新内容包只覆盖保留主题；已有内容与发布历史保留。每主题先预留 3–5 小时准备证据，达人与电商工作另计。','New packs cover retained topics. Existing content and publication history stay intact. Allow 3–5 hours per evidence pack; creator and commerce work is additional.')}</div>`,d=>{const topics=TOPICS.filter(t=>d['topic-'+t.id]).map(t=>t.id);if(!topics.length)throw Error(T('至少保留一个主题。','Keep at least one topic.'));const h=Number(d.hours),budget=Number(d.budget);const removed=S.plan.topics.filter(x=>!topics.includes(x));const retained=topics.map(id=>TOPICS.find(t=>t.id===id));modal(()=>T('确认计划差异','Review plan changes'),()=>`<div class="card pad"><h3>v${S.plan.version} → v${S.plan.version+1}</h3><p style="margin-top:10px">${S.brief.hours} h → ${h} h / ${T('周','week')}<br>¥${S.brief.budget} → ¥${budget}</p></div><h3 style="margin-top:18px">${T('保留','Retain')}</h3><p>${retained.map(t=>esc(t.model+' · '+L(t.name))).join('<br>')}</p><h3 style="margin-top:18px">${T('本轮推迟','Defer this round')}</h3><p>${removed.map(id=>esc(L(TOPICS.find(t=>t.id===id).name))).join('<br>')||T('无','None')}</p><div class="notice" style="margin-top:18px">${T('计划估算：证据准备约','Estimate: evidence preparation takes about')} ${topics.length*3}–${topics.length*5} h · ${T('约需','around')} ${Math.ceil(topics.length*5/h)} ${T('周，未含外部拍摄、发布等待或达人沟通。','weeks, excluding external production, publishing waits and creator communication.')}</div>`,()=>{S.plan.history.push({version:S.plan.version,topics:[...S.plan.topics],hours:S.brief.hours,budget:S.brief.budget,at:new Date().toISOString()});S.plan.version++;S.plan.topics=topics;S.plan.accepted=false;S.brief.hours=h;S.brief.budget=budget;replanTopicTasks();saved()},()=>T('采用调整，待确认启动','Apply changes; review before launch'))},()=>T('预览变化','Preview changes'))}
function openFact(model){const f=S.facts.find(f=>f.model===model);modal(()=>T('产品事实卡','Product fact card')+' · '+model,()=>`<div class="notice soft">${T('已填入官网资料。可直接编辑下方英文事实卡；展开来源查看参数差异，确认可使用的表述后填写核实人。','Website details are filled in. Edit the English fact card below, review source discrepancies, and record the verifier when wording is confirmed.')}</div>${websiteReference(model)}<div style="margin-top:17px">${area('text',T('可引用事实与适用限制','Citable facts and limitations'),f.text)}${area('source',T('来源 URL / 文件位置 / 版本与页码','Source URL / document location / version and page'),f.source)}<div class="fields">${field('reviewer',T('核实人','Verified by'),f.reviewer)}${field('updated',T('核实日期','Verification date'),f.updated||today(),'date')}</div>${check('verified',T('我已核对以上事实与来源，仅对已核实内容负责','I have checked these facts against the cited sources'),f.status==='verified')}</div>`,d=>{if(d.verified){required(d.text,T('已核实事实不能为空。','Verified facts cannot be empty.'));required(d.source,T('请记录事实来源。','Add the source.'));required(d.reviewer,T('请记录核实人。','Add the verifier.'))}const changed=f.text!==d.text||f.source!==d.source||f.status!== (d.verified?'verified':'draft');if(changed){f.version++;S.contents.filter(c=>c.model===model).forEach(c=>{c.stale=true;c.approved=false})}Object.assign(f,{text:d.text,source:d.source,reviewer:d.reviewer,updated:d.updated,status:d.verified?'verified':'draft'});saved()})}
function openMarket(key){const [model,market]=key.split(':'),m=S.markets.find(m=>m.model===model&&m.market===market);modal(()=>T('购买入口核对','Purchase route check')+' · '+model+' / '+market,()=>`<div class="fields">${field('asin',T('实际 ASIN','Actual ASIN'),m.asin,'text','pattern="[A-Za-z0-9]{10}"')}${field('url',T('对应市场商品 / 店铺 URL','Marketplace product / Store URL'),m.url,'url')}${field('inventory',T('可售库存天数','Days of stock'),m.inventory,'number','min="0"')}${field('price',T('当地售价','Local selling price')+' · '+m.currency,m.price,'number','min="0" step="0.01"')}${field('owner',T('核查人','Checked by'),m.owner)}${field('checkedAt',T('核查日期','Check date'),m.checkedAt||today(),'date')}</div>${check('checked',T('已打开核对型号、国家、库存与购买状态','I opened the page and checked model, country, stock and purchase availability'),m.checked)}<div class="notice">${T('这是人工核对记录，软件没有查询实时库存。不要仅因链接能打开就认定参数或归因正确。','This is a manual check; the workspace does not query live inventory. An accessible page does not establish correct specs or attribution.')}</div>`,d=>{const u=new URL(needUrl(d.url)),expected=market==='US'?'amazon.com':'amazon.ca';if(!(u.hostname===expected||u.hostname.endsWith('.'+expected)))throw Error(T('购买网址与所选市场不一致。','Purchase URL does not match the marketplace.'));if(d.checked){required(d.asin,T('请先填入实际 ASIN。','Add the actual ASIN.'));required(d.owner,T('请填写核查人。','Add the checker.'))}Object.assign(m,{...d,checked:!!d.checked,currency:market==='US'?'USD':'CAD'});saved()})}
function openEvidence(id){const t=TOPICS.find(t=>t.id===id),e=S.evidence.find(e=>e.id===id);modal(()=>t.model+' · '+L(t.name)+' · '+T('证据包','Evidence pack'),()=>`<div class="sourceblock">${esc(t.question)}<br><br>${L(t.steps)}</div><div style="margin-top:18px">${area('method',T('测试条件：地面、数量、模式、附件、次数','Conditions: surface, amount, mode, attachment, passes'),e.method)}${area('raw',T('原片 / 图片 / 测试记录地址','Original footage / images / test record locations'),e.raw)}${area('outcome',T('实际观察结果及限制','Actual observations and limitations'),e.outcome)}${field('reviewer',T('核对人','Reviewed by'),e.reviewer)}${check('ready',T('以上是已核对的真实记录，可供内容引用','These are verified real records suitable for content reference'),e.ready)}</div>`,d=>{if(d.ready){for(const k of ['method','raw','outcome','reviewer'])required(d[k],T('核实前请补齐条件、原始资料、结果和核对人。','Add conditions, originals, findings and reviewer before verification.'))}const changed=['method','raw','outcome'].some(k=>e[k]!==d[k])||e.ready!==!!d.ready;if(changed)S.contents.filter(c=>c.topic===id).forEach(c=>{c.approved=false;c.stale=true});Object.assign(e,{...d,ready:!!d.ready});saved()})}
function composeLegacyContent(topic,channel,market){const f={status:'missing'},e={ready:false},model=topic.model;const facts=f.status==='verified'?f.text:'[Add approved model-specific facts before publication.]';const evidence=e.ready?`Test conditions: ${e.method}\nObserved findings: ${e.outcome}\nSource records: ${e.raw}`:'[This is a preparation draft. Record real test conditions, source footage and actual findings before describing a result.]';const end=`\n\nProduct information: [VERIFIED TERGEO PAGE / UTM]\n${market==='US'?'United States':'Canada'} purchase availability: [AMAZON ${market} ATTRIBUTION URL]\nDisclosure: Published by the Tergeo brand team. Results depend on surface, debris, operating mode and maintenance. Check current specifications and local availability.`;
if(channel==='Website')return {title:`${topic.short} | Tergeo ${model}`,body:`# ${topic.short}\n\n${topic.question}\n\nStart with your surface, cleaning task and the maintenance routine you can sustain. A meaningful product comparison describes its conditions and limitations instead of relying on one headline specification.\n\n## What to check\n${topic.steps[1]}\n\n## Model-specific information\n${facts}\n\n## Documented test\n${evidence}\n\n## Choosing for your home\nCompare floor compatibility, access around furniture, cleaning and storage, and locally available support. Confirm suitability in the product manual. If evidence is missing, ask for the supporting record rather than assuming performance.\n\n## Before buying\nCheck the exact model, included accessories, current stock, shipping and warranty in your own marketplace. US and Canadian offers may differ.${end}`};
if(channel==='YouTube')return {title:`${model} test plan: ${topic.short}`,body:`PRODUCTION SCRIPT — ${model} / ${market}\n\nTITLE\n${topic.short} | Tergeo ${model}\n\n00:00–00:10 · THE QUESTION\nOn-screen: ${topic.question}\nShow the actual cleaning problem before introducing the product.\n\n00:10–00:35 · TEST SETUP\n${topic.steps[1]}\n\n00:35–02:00 · CONTINUOUS DEMONSTRATION\nFilm the full pass without cuts. Keep the same amount of debris, camera position and operating mode. Show repeat passes if needed; do not hide failed attempts.\n\n02:00–02:40 · RESULTS AND MAINTENANCE\nShow remaining debris, the roller and bin/tank as applicable. State only findings supported by the original recording.\n\nAPPROVED PRODUCT FACTS\n${facts}\n\nEVIDENCE TO SHOW\n${evidence}\n\n02:40–03:00 · NEXT STEP\nSee full test conditions and current ${market} availability in the description.\n\nPUBLISHING DESCRIPTION\nThis video documents the test setup and observed results for the Tergeo ${model}. Replace this preparation wording with the actual tested conditions after filming.${end}`};
if(['Shorts','TikTok','Instagram'].includes(channel))return {title:`${topic.short} · ${channel}`,body:`${channel.toUpperCase()} · VERTICAL VIDEO PLAN · 20–30 SEC\n\n0–3s: Show the problem. Text: “${topic.short}”\n3–8s: Show model ${model}, surface and test setup.\n8–20s: Use a continuous excerpt from the documented test. State the actual mode, passes and limitations on screen.\n20–30s: Show the remaining debris or maintenance step. CTA: “Full test conditions and ${market} availability in our profile.” Use this CTA only after the profile link is live and tested.\n\nSHOT BRIEF\n${topic.steps[1]}\n\nEVIDENCE\n${evidence}\n\nCAPTION DRAFT\nA useful cleaning test shows the setup as well as the result. We are documenting ${topic.model} under stated conditions so shoppers can judge whether it fits their own home. [Insert the verified observed finding after filming.]\n\nDisclosure: This is Tergeo brand content. Add any paid/gifted partnership disclosure prominently in the video and caption when applicable.\n\nUse original watermark-free footage. Review the final subtitles, cover and permitted clickable link location for ${channel}.${end}`};
return {title:`Answer draft: ${topic.question}`,body:`${topic.question}\n\nA useful comparison starts with the floor type, the kind of debris and the maintenance you are willing to do. Check the product manual for compatible surfaces and permitted operating conditions before testing.\n\n${topic.steps[1]}\n\nKeep the camera angle, debris amount and operating mode consistent. Count the passes and inspect the roller or tank as well as the visible floor. One edited before-and-after clip is not enough to establish a general performance claim.\n\nIf you need model-specific information, use the current approved documentation and ask about any missing limits.\n\nDisclosure: I work with Tergeo. This is a testing and selection method, not an independent recommendation of our brand.\n\nEDITOR NOTE: Personalize this reply to the actual question and community rules. No link is included by default; do not post the same answer across communities.`}}
function replanTopicTasks(){for(const t of TOPICS){const id='TOPIC-'+t.id,old=S.tasks.find(x=>x.id===id),i=S.plan.topics.indexOf(t.id);if(old?.done)continue;const when=i<0?T('待重新安排','To reschedule'):'Week '+(Math.floor(i*5/Number(S.brief.hours))+1)+'–'+Math.ceil((i+1)*5/Number(S.brief.hours));put(S.tasks,{id,title:[t.model+' · '+t.name[0]+'证据与内容',t.model+' · '+t.name[1]+' evidence and content'],when,owner:old?.owner||'CO',source:16,page:'content',done:false,note:old?.note||'',phase:0,deferred:i<0})}}
function generatePacks(ids,markets){let created=0;ids.forEach(id=>{const t=TOPICS.find(t=>t.id===id);markets.forEach(market=>CHANNELS.forEach(channel=>{if(S.contents.some(c=>c.topic===id&&c.market===market&&c.channel===channel))return;const text=composeContent(t,channel,market);S.contents.push({id:uid(t.model+'-'+market+'-'+channel.toLowerCase()),topic:id,model:t.model,market,channel,...text,version:1,factVersion:S.facts.find(f=>f.model===t.model).version,approved:false,stale:false,receipt:null,draft:null,created:today()});created++}))});save();return created}
function openGenerate(id){const ids=id?[id]:S.plan.topics;modal(()=>T('准备可编辑英文内容包','Prepare editable English content packs'),()=>`<p>${ids.map(id=>{const t=TOPICS.find(t=>t.id===id);return esc(t.model+' · '+L(t.name))}).join('<br>')}</p><div class="fields" style="margin-top:18px">${select('markets',T('准备哪些市场','Markets'),[['both',['US 与 CA 分别生成','Generate separately for US and CA']],'US','CA'],'both')}</div><div class="card pad"><h3>${T('每个主题、每个市场准备 7 份文稿','7 editable outputs per topic and market')}</h3><p class="small" style="margin-top:9px">Website FAQ · YouTube · Shorts · TikTok · Instagram · Reddit · Quora</p></div><div class="notice" style="margin-top:18px">${T('使用官网型号资料与手册主题，生成包含具体功能、FAQ、镜头安排及真实来源的英文文稿。已存在的编辑会保留；视频脚本需拍摄完成后发布。','Uses official model details and playbook topics to assemble feature copy, FAQs, shot plans and real sources. Existing edits are preserved. Video scripts require production before publishing.')}</div>`,d=>{const n=generatePacks(ids,d.markets==='both'?['US','CA']:[d.markets]);closeDialog();tab.content='library';page='content';render();toast(`已准备 ${n} 份文稿，事实和实拍仍需核对。`,`${n} drafts prepared. Verify facts and real footage before use.`)},()=>T('准备内容包','Prepare content packs'))}
function openContent(id){const c=S.contents.find(c=>c.id===id);if(!c)return;modal(()=>c.model+' / '+c.market+' · '+c.channel+' · v'+c.version,()=>`<div class="between"><div class="row">${badge(contentStatus(c),c.receipt?'green':c.approved?'purple':'amber')}${badge(T('英文内容','English content'))}</div>${button(T('查看主题证据','Topic evidence'),'evidence',c.topic,'small')}</div>${c.stale?`<div class="notice" style="margin-top:15px">${T('产品事实或测试证据已变化。核对新资料后修正文稿，再确认版本；已发布记录不会被删除。','Product facts or evidence changed. Review and revise before approving again. Publication history is retained.')}</div>`:''}<div style="margin-top:16px">${field('title',T('标题','Title'),c.draft?.title??c.title)}${area('body',T('正文 / 拍摄脚本','Text / production script'),c.draft?.body??c.body)}</div><div class="row">${button(T('导出草稿','Export draft'),'download-content',id,'small')}${button(T('复制正文','Copy text'),'copy-content',id,'small')}${button(T('登记链接','Add tracking link'),'link-for',id,'small')}${button(T('插入已测试链接','Insert tested links'),'insert-links',id,'small')}${button(T('核对并确认版本','Review & approve'),'approve',id,'small')}${button(T('记录人工发布','Record publication'),'receipt',id,'small')}${button(T('预览官网资料新版','Preview website-based draft'),'refresh-content',id,'small')}</div>${websiteReference(c.model)}${publishGuide(c)}${c.receipt?`<div class="sourceblock" style="margin-top:17px">${T('最新发布记录','Latest publication record')} · v${c.receipt.version}<br>${esc(c.receipt.url)}<br>${esc(c.receipt.date)} · ${esc(c.receipt.owner)} · ${esc(c.receipt.method)}</div>`:''}<p class="source-note">${T('输入会暂存在本机草稿。保存修改会生成新版本并取消旧确认，不会自动改动已发布页面。','Typing is saved locally as a draft. Saving creates a new version and invalidates approval; published pages are not changed automatically.')}</p>`,d=>{if(d.title!==c.title||d.body!==c.body){c.history=c.history||[];c.history.push({version:c.version,title:c.title,body:c.body});c.version++;c.approved=false;c.title=d.title;c.body=d.body}c.draft=null;c.stale=false;c.factVersion=S.facts.find(f=>f.model===c.model).version;save();openContent(id);render();toast('内容版本已保存。','Content version saved.')},()=>T('保存内容版本','Save content version'));document.querySelector('[name=body]')?.classList.add('editor');document.getElementById('dialog-form').dataset.content=id}
function publishGuide(c){const targets={Website:S.brief.site,YouTube:'https://studio.youtube.com/',Shorts:'https://studio.youtube.com/',TikTok:'https://www.tiktok.com/',Instagram:'https://www.instagram.com/',Reddit:'https://www.reddit.com/',Quora:'https://www.quora.com/'};const video=['YouTube','Shorts','TikTok','Instagram'].includes(c.channel);return `<div class="publish-guide"><h3>${T('从文稿到公开内容','From draft to publication')}</h3><ol><li>${video?T('依据脚本完成真实拍摄、剪辑、字幕和披露，保存成片。','Film, edit and subtitle real footage, add disclosure and save the final video.'):T('核对资料来源，编辑成品，按实际发布位置调整格式。','Verify sources, edit the finished text and adapt its format to the destination.')}</li><li>${T('登记对应内容的购买与官网链接，完成点击测试，再插入文稿。','Register and test the purchase and website links for this output, then insert them.')}</li><li>${T('确认当前版本，在目标平台人工发布。','Approve this version and publish manually on the target platform.')}</li><li>${T('返回本页填写公开 URL、日期、执行人和核验方式。','Return here to record the public URL, date, publisher and verification method.')}</li></ol><div class="row"><a class="btn small" href="${esc(targets[c.channel])}" target="_blank" rel="noopener noreferrer">${T('打开平台 ↗','Open platform ↗')}</a><span class="small muted">${T('打开网站不会自动登录或发布','Opening a site does not sign in or publish')}</span></div></div>`}

function openApprove(id){const c=S.contents.find(c=>c.id===id),f=S.facts.find(f=>f.model===c.model),e=S.evidence.find(e=>e.id===c.topic);modal(()=>T('确认具体内容版本','Approve this content version')+' · v'+c.version,()=>`<h3>${esc(c.title)}</h3><div class="notice" style="margin:16px 0">${T('请先保存文稿，再核对事实、成片与链接。确认只适用于当前版本，不代表已经发布。','Save the draft first, then check facts, final media and links. Approval applies only to this version; it does not mean published.')}</div>${check('facts',T('正文参数与已核实事实一致，没有未替换占位符','Claims match verified facts and all placeholders are resolved'))}${check('evidence',T('实测结论有原始记录；视频已完成拍摄与字幕核对','Test claims have original records; video production and subtitles are complete'))}${check('disclosure',T('身份、样品或付费关系已按实际情况披露','Affiliation, samples and payment are disclosed as applicable'))}${check('links',T('购买国家、型号和链接位置已核对','Market, model and link placement have been checked'))}${field('owner',T('审核人','Reviewer'),'')}`,d=>{if(c.draft||c.stale)throw Error(T('请先保存稿件并核对最新事实。','Save the draft and review the latest facts first.'));if(f.status!=='verified')throw Error(T('该型号事实卡尚未核实。','The model fact card is not verified.'));if(!e.ready&&['YouTube','Shorts','TikTok','Instagram'].includes(c.channel))throw Error(T('视频内容需要已核实的实拍证据包。','Video content requires a verified evidence pack.'));if(/\[[^\]\n]+\]/.test(c.body))throw Error(T('正文仍有方括号占位内容，请先补全或删除不适用段落。','The body still contains bracketed placeholders. Resolve them or remove inapplicable sections.'));if(!['facts','evidence','disclosure','links'].every(k=>d[k]))throw Error(T('请完成四项核对。','Complete all four checks.'));required(d.owner,T('请填写审核人。','Enter the reviewer.'));c.approved=true;c.approver=d.owner;c.approvedAt=today();save();closeDialog();render();openContent(id)},()=>T('确认此版本','Approve this version'))}
function openReceipt(id){const c=S.contents.find(c=>c.id===id),r=c.receipt||{};modal(()=>T('记录人工发布回执','Record manual publication'),()=>`${field('url',T('实际公开 URL','Actual public URL'),r.url||'','url','required') }<div class="fields">${field('date',T('发布日期','Publication date'),r.date||today(),'date','required')}${field('owner',T('实际执行人','Published by'),r.owner||'','text','required')}</div>${area('method',T('核验方式与记录','Verification method and evidence'),r.method||'')}${check('checked',T('我已在目标平台打开并核对内容及市场链接','I opened the live content and checked the content and marketplace links'))}<div class="notice soft">${T('该步骤只记录你已完成的发布，不会向平台发出发布请求。','This records a publication you completed; it does not send a publishing request.')}</div>`,d=>{if(!c.approved||c.draft||c.stale)throw Error(T('请先审核确认已保存的当前版本。','Approve the saved current version first.'));needUrl(d.url);required(d.owner,T('请填写执行人。','Enter the publisher.'));required(d.method,T('请记录核验方式。','Record how you verified publication.'));if(!d.checked)throw Error(T('请核对公开内容。','Check the public content.'));if(c.receipt){c.receipts=c.receipts||[];c.receipts.push(c.receipt)}c.receipt={...d,version:c.version};saved()})}

ng to the registered brand or corporate website.'));u.searchParams.set('utm_source',c.channel.toLowerCase());u.searchParams.set('utm_medium','organic_social');u.searchParams.set('utm_campaign',`${c.market.toLowerCase()}_${c.model.toLowerCase()}_${S.brief.start.replaceAll('-','')}`);u.searchParams.set('utm_content',c.id);url=u.href}else{const host=new URL(url).hostname,expected=c.market==='US'?'amazon.com':'amazon.ca';if(!(host===expected||host.endsWith('.'+expected)))throw Error(T('请提供对应 Amazon 市场的原始目标链接，不手工换域名。','Provide the original URL for the selected Amazon marketplace; do not rewrite the domain.'));if(!d.fromConsole)throw Error(T('请确认 Attribution 链接确实来自后台。','Confirm the Attribution link came from the account console.'))}if(d.tested)required(d.reviewer,T('请填写测试人。','Add the tester.'));const dup=S.links.find(x=>x.id!==id&&x.url===url&&x.content!==c.id);if(dup)throw Error(T('该跟踪 URL 已用于另一条内容，请创建独立链接。','That tracking URL is already assigned to another output. Create a distinct link.'));put(S.links,{id:id||uid('LINK'),content:c.id,model:c.model,market:c.market,channel:c.channel,kind:d.kind,base:d.base,url,publisher:d.publisher,tested:!!d.tested,fromConsole:!!d.fromConsole,reviewer:d.reviewer,at:today()});saved()})}

function validBackup(v){
 if(!v||v.schema!==2||!v.brief||!v.plan)return false;
 const models=['V40','V50','W10'],markets=['US','CA'];
 for(const k of ['facts','markets','tasks','evidence','contents','links','creators','observations','sales','decisions','activity'])if(!Array.isArray(v[k]))return false;
 if(!Number.isInteger(v.plan.version)||!Array.isArray(v.plan.topics)||!Array.isArray(v.plan.history)||!v.plan.topics.every(id=>TOPICS.some(t=>t.id===id)))return false;
 if(v.facts.length!==3||v.markets.length!==6||v.evidence.length!==4||!models.every(m=>v.facts.some(f=>f.model===m)))return false;
 for(const k of ['brand','goal','audience','owner','start','site','company'])if(typeof v.brief[k]!=='string')return false;
 if(!webUrl(v.brief.site)||!Number.isFinite(v.brief.hours)||v.brief.hours<=0||!Number.isFinite(v.brief.budget)||v.brief.budget<0)return false;
 for(const f of v.facts)if(!models.includes(f.model)||typeof f.text!=='string'||typeof f.source!=='string'||!Number.isInteger(f.version)||!['missing','draft','sourced','verified'].includes(f.status))return false;
 for(const m of v.markets)if(!models.includes(m.model)||!markets.includes(m.market)||!['USD','CAD'].includes(m.currency))return false;
 for(const e of v.evidence)if(!TOPICS.some(t=>t.id===e.id)||typeof e.method!=='string')return false;
 for(const t of v.tasks)if(typeof t.id!=='string'||!Number.isInteger(t.source)||!['overview','plan','content','results','assets'].includes(t.page))return false;
 for(const c of v.contents)if(typeof c.id!=='string'||!models.includes(c.model)||!markets.includes(c.market)||!TOPICS.some(t=>t.id===c.topic)||!CHANNELS.includes(c.channel)||typeof c.body!=='string'||typeof c.title!=='string'||!Number.isInteger(c.version)||(c.receipt&&!Number.isInteger(c.receipt.version)))return false;
 for(const l of v.links)if(!models.includes(l.model)||!markets.includes(l.market)||!['UTM','Attribution'].includes(l.kind))return false;
 for(const c of v.creators)if(!models.includes(c.model)||!markets.includes(c.market)||!Number.isFinite(c.score))return false;
 for(const o of v.observations)if(!QUESTIONS.some(q=>q.id===o.question)||!markets.includes(o.market)||typeof o.date!=='string')return false;
 for(const s of v.sales){if(!models.includes(s.model)||!markets.includes(s.market)||!['USD','CAD'].includes(s.currency))return false;for(const k of ['clicks','dpv','orders','net','revenue','cost','breakeven'])if(s[k]!==null&&(!Number.isFinite(s[k])||s[k]<0))return false}
 for(const d of v.decisions)if(!markets.includes(d.market)||!['continue','change','stop'].includes(d.type))return false;
 return true;
}

async function api(path,body){const auth=()=>A.sessionToken?{Authorization:'Bearer '+A.sessionToken}:{};if(!A.session){const r=await fetch(apiURL('/api/session'),{headers:auth(),credentials:'include'});if(r.status===401){A.authRequired=true;const error=Error(T('请使用管理员发放的成员访问令牌登录。','Sign in with the member access token provided by your administrator.'));error.code='auth_required';throw error}if(!r.ok)throw Error(T('执行后台尚未启动，请联系管理员。','The workspace service is unavailable. Contact your administrator.'));A.session=await r.json();if(A.session.sessionToken){A.sessionToken=A.session.sessionToken;sessionStorage.setItem('agent-session-token',A.sessionToken)}if(A.session.workspace){A.workspace=A.session.workspace;localStorage.setItem('agent-workspace',A.workspace)}A.authRequired=false}const r=await fetch(apiURL('/api/'+path+(path.includes('?')?'&':'?')+'workspace='+encodeURIComponent(A.workspace)),{method:body===undefined?'GET':'POST',credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':A.session.csrf,...auth()},body:body===undefined?undefined:JSON.stringify(body)});let value;try{value=await r.json()}catch{throw Error(T('工作台服务暂时不可用，请联系管理员。','The workspace service is temporarily unavailable. Contact your administrator.'))}if(!r.ok){if(value.error?.code==='csrf'){A.session=null;return api(path,body)}if(r.status===401){A.session=null;A.data=null;A.sessionToken='';sessionStorage.removeItem('agent-session-token');A.authRequired=true}throw Error(value.error?.message||'Request failed')}return value}

function distributionStatus(status){const map={
 not_started:[T('未开始','Not started'),''],queued_generation:[T('等待 AI 准备','Waiting for AI'),'purple'],generating:[T('AI 正在准备','AI is preparing'),'purple'],generation_blocked:[T('生成被阻断','Generation blocked'),'amber'],generation_failed:[T('生成失败','Generation failed'),'amber'],source_changed:[T('官网母稿已更新','Website source changed'),'amber'],draft:[T('已生成，待审核','Generated, needs review'),'amber'],pending_review:[T('待审核','Needs review'),'amber'],approved:[T('已批准','Approved'),'green'],queued:[T('已批准，等待执行','Approved, waiting'),'purple'],publishing:[T('正在提交','Submitting'),'purple'],reconciling:[T('正在核验','Reconciling'),'purple'],processing:[T('平台处理中','Platform processing'),'purple'],needs_reconciliation:[T('结果待核验','Result needs verification'),'amber'],manual_handoff:[T('待人工发布','Manual publishing needed'),'amber'],blocked:[T('发布被阻断','Publishing blocked'),'amber'],failed:[T('发布失败','Publishing failed'),'amber'],rejected:[T('已退回','Rejected'),'amber'],invalidated:[T('版本已变化，需重新审核','Version changed; review again'),'amber'],cancelled:[T('已取消','Cancelled'),''],completed_unverified:[T('状态异常，需核验','Unverified result'),'amber'],published:[T('已核验发布','Verified published'),'green']

function distributionReview(item){const c=item.counts||{};if(item.status==='not_started')return T('未开始','Not started');if(['queued_generation','generating'].includes(item.status))return T('AI 正在准备','AI is preparing');if(c.pendingReview)return T('有待审核版本','Version needs review');if(['approved','queued','publishing','processing','reconciling','needs_reconciliation','manual_handoff','completed_unverified','published'].includes(item.status))return T('当前版本已审核','Current version reviewed');return distributionStatus(item.status)}
function distributionSummary(projection){const s=projection?.summary||{};return `<div class="tiles distribution-summary">${[[s.regionVersions??s.platforms??'—',T('区域版本','Regional versions')],[s.generating??'—',T('正在准备','Preparing')],[s.pendingReview??'—',T('待审核','Needs review')],[s.published??'—',T('已核验发布','Verified published')]].map(([n,t])=>`<div class="card tile"><label>${t}</label><strong>${n}</strong></div>`).join('')}</div>`}
function distributionAction(item){const latest=item.latest||{},status=item.status,parts=[],regionalKey=item.id+'|'+(item.market||'');if(simpleRegionPaused(item.market)){if(latest.artifactId)parts.push(button(T('预览','Preview'),'distribution-preview',latest.artifactId,'small'));if(latest.actionId&&!['pending_review','draft'].includes(status))parts.push(button(T('查看状态','View status'),'distribution-status',latest.actionId,'small'));parts.push(button(T('区域已暂停','Region paused'),'region-paused-info',item.market,'small'));return parts.join('')}if(simpleCanEdit()&&status==='not_started')parts.push(button(T('准备版本','Prepare version'),'distribution-create',regionalKey,'primary small'));if(simpleCanEdit()&&status==='source_changed')parts.push(button(T('重新生成','Regenerate'),'distribution-create',regionalKey,'primary small'));if(latest.artifactId)parts.push(button(T('预览','Preview'),'distribution-preview',latest.artifactId,'small'));if(simpleCanEdit()&&['draft','invalidated','rejected'].includes(status)&&latest.artifactId)parts.push(button(T('编辑并准备审核','Edit & prepare review'),'distribution-review',latest.artifactId,'primary small'));if(simpleCanApprove()&&status==='pending_review'&&latest.actionId)parts.push(button(T('审批','Approve'),'distribution-status',latest.actionId,'primary small'));else if(simpleCanEdit()&&status==='pending_review'&&latest.artifactId)parts.push(button(T('查看版本','Open version'),'distribution-review',latest.artifactId,'small'));if(simpleCanApprove()&&['needs_reconciliation','completed_unverified'].includes(status)&&latest.actionId)parts.push(button(T('核验结果','Verify result'),'agent-reconcile',latest.actionId,'primary small'));else if(latest.actionId&&!['not_started','queued_generation','generating','draft','pending_review','source_changed'].includes(status))parts.push(button(T('查看状态','View status'),'distribution-status',latest.actionId,'small'));if(simpleCanApprove()&&status==='manual_handoff'&&latest.actionId)parts.push(button(T('登记回执','Record receipt'),'agent-receipt',latest.actionId,'small'));if(simpleIsOwner()&&!item.connection?.apiTested)parts.push(button(T('设置账号','Set up account'),'publishing-account-open',item.id,'small'));return parts.join('')||'—'}
function distributionRegion(item){return item.market==='CA'?{name:T('加拿大','Canada'),locale:T('英文 · 加拿大版','English · Canada edition')}:{name:T('美国','United States'),locale:T('英文 · 美国版','English · US edition')}}
function distributionOffer(item,artifact){const model=artifact?.model||distributionProjection()?.filters?.model||'',readiness=A.data?.productReadiness?.find(r=>r.model===model&&r.market===item.market&&r.status==='ready'),url=readiness?.purchaseUrl;return `<strong>${esc(model||T('待选择产品','Product not selected'))}</strong><small>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${T('打开该区域商品页 ↗','Open regional product page ↗')}</a>`:T('区域商品链接尚未核对','Regional product link not verified')}</small>`}
function distributionRows(items){return items.map(item=>{const format=distributionValue(item.format),artifact=distributionArtifact(item),title=artifact?.title||T('尚未生成区域话术','Regional copy not generated'),region=distributionRegion(item);return `<tr><td><div class="distribution-platform"><i>${esc(distributionIcon(item.id))}</i><div><strong>${esc(distributionValue(item.label)||item.channel||item.id)}</strong><small>${esc(item.channel||'')}</small></div></div></td><td data-label="${T('目标区域','Target market')}" class="distribution-cell">${badge(esc(item.market),'purple')} <strong>${esc(region.name)}</strong><small>${esc(region.locale)}</small></td><td data-label="${T('推荐产品 / 链接','Product / link')}" class="distribution-cell">${distributionOffer(item,artifact)}</td><td data-label="${T('区域话术','Regional copy')}" class="distribution-cell"><strong>${esc(title)}</strong><small>${esc(format)||'—'}</small></td><td data-label="${T('审核进度','Review')}">${distributionReview(item)}</td><td data-label="${T('发布状态','Publishing')}" class="distribution-cell">${distributionStatus(item.status)}<small>${distributionPublishing(item)}</small></td><td data-label="${T('操作','Actions')}"><div class="distribution-actions">${distributionAction(item)}</div></td></tr>`}).join('')}
function distributionPage(){const d=A.data,p=distributionProjection();return `${heading('TERGEO / PLATFORM × MARKET',T('平台推广 · 区域版本','Platform promotion · Regional versions'),T('同一个平台按区域使用不同话术、商品链接和发布账号；US 与 CA 独立生成、审核和记录。','Each platform uses market-specific copy, product links and accounts. US and CA are generated, approved and recorded independently.'),button(T('刷新','Refresh'),'agent-refresh','','small'))}${A.error?`<div class="notice">${esc(A.error)}</div>`:!d?empty(T('正在读取平台状态','Loading platform status'),T('从执行后台读取渠道内容与交付回执。','Fetching channel content and delivery receipts.')):!p?`<div class="card distribution-empty">${empty(T('平台总览尚未接入','Platform overview is not available'),T('后台未返回平台推广数据。不会使用模拟状态代替。','The backend did not return platform promotion data. No simulated state is shown.'),button(T('刷新','Refresh'),'agent-refresh','','primary'))}</div>`:`${distributionSummary(p)}<div class="distribution-toolbar"><div class="field"><label>${T('产品','Product')}</label><select id="distribution-model"><option value="">${T('全部产品','All products')}</option>${['V40','V50','W10'].map(v=>`<option value="${v}" ${p.filters?.model===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>${T('目标区域','Target market')}</label><select id="distribution-market"><option value="">${T('US + CA 全部区域版本','All US + CA versions')}</option>${[['US',T('美国 · US','United States · US')],['CA',T('加拿大 · CA','Canada · CA')]].map(([v,label])=>`<option value="${v}" ${p.filters?.market===v?'selected':''}>${label}</option>`).join('')}</select></div><span class="push"></span>${button(T('从官网内容准备区域版本','Prepare regional versions'),'distribution-create','','primary')}</div>${p.items?.length?`<section class="card distribution-table"><table><thead><tr><th>${T('平台','Platform')}</th><th>${T('目标区域','Target market')}</th><th>${T('推荐产品 / 区域链接','Product / regional link')}</th><th>${T('区域话术','Regional copy')}</th><th>${T('审核进度','Review')}</th><th>${T('发布状态','Publishing')}</th><th>${T('操作','Actions')}</th></tr></thead><tbody>${distributionRows(p.items)}</tbody></table></section>`:`<div class="card distribution-empty">${empty(T('没有区域版本记录','No regional versions'),T('选择产品或从官网内容准备平台区域版本。','Choose a product or prepare platform versions from website content.'))}</div>`}<div class="distribution-note"><strong>${T('区域不是一个标签，而是一套绑定关系','A market is a bound content package, not just a label')}</strong><p>${T('每份平台内容绑定目标区域、区域商品链接和允许该区域的发布账号。任一项不匹配，后台都会阻止发布。','Every platform version binds its target market, regional product link and an account allowed for that market. Any mismatch blocks publication.')}</p></div>`}`}

 {id:'website',provider:'shopify',label:['官网 / Shopify','Website / Shopify'],channel:'Website'},
 {id:'x',provider:'x-manual',label:['X / Twitter','X / Twitter'],channel:'X'},

 {id:'youtube-shorts',provider:'youtube',label:['YouTube Shorts','YouTube Shorts'],channel:'Shorts'},
 {id:'youtube',provider:'youtube',label:['YouTube','YouTube'],channel:'YouTube'},
